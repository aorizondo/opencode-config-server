version: '3.8'

services:
  # Servidor principal de configuración OpenCode
  opencode-config:
    build:
      context: .
      dockerfile: Dockerfile
      # Para desarrollo, usar target builder para hot reload
      # target: builder
    container_name: opencode-enterprise-config
    hostname: opencode-config
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Configuración del servidor
      - SERVER_BASE_URL=https://opencode-config.tu-empresa.corp
      # OAuth2 - Configurar con tus valores reales
      - OAUTH2_TOKEN_URL=https://auth.tu-empresa.corp/oauth2/token
      - OAUTH2_AUDIENCE=opencode-enterprise
      - OAUTH2_ISSUER=https://auth.tu-empresa.corp
      - JWKS_URL=https://auth.tu-empresa.corp/.well-known/jwks.json
      # Paths de configuración (dentro del contenedor)
      - CONFIG_ROOT=/app/config_root
      - OUT_OF_BAND_ROOT=/app/out_of_band
      # Variables de entorno para el bootstrap script (se inyectan en .opencode.env)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENCODE_JIRA_TOKEN=${OPENCODE_JIRA_TOKEN:-}
    volumes:
      # Montar configuración para desarrollo (opcional, quitar en prod)
      # - ./config_root:/app/config_root:ro
      # - ./out_of_band:/app/out_of_band:ro
      # Logs persistentes
      - opencode-logs:/var/log/opencode
    networks:
      - opencode-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M


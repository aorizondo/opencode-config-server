# Production-ish deployment. TLS belongs in front of this: put it behind your
# ingress controller or the commented Traefik service below.
services:
  opencode-config:
    build: .
    image: opencode-config-server:2.0.0
    container_name: opencode-enterprise-config
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OCS_ENV: production
      OCS_BASE_URL: ${OCS_BASE_URL:?set OCS_BASE_URL in .env}
      OCS_SESSION_SECRET: ${OCS_SESSION_SECRET:?generate one with python -m opencode_config_server.secret}
      OCS_CONFIG_DIR: /app/config
      OCS_TOKEN_TTL_DAYS: ${OCS_TOKEN_TTL_DAYS:-90}
      OCS_SESSION_ENV: ${OCS_SESSION_ENV:-OPENCODE_CORP_SESSION}
      OCS_RATE_LIMIT_ATTEMPTS: ${OCS_RATE_LIMIT_ATTEMPTS:-10}
      OCS_RATE_LIMIT_WINDOW: ${OCS_RATE_LIMIT_WINDOW:-300}
      # Enable only if the proxy in front of this sets X-Forwarded-For itself.
      OCS_TRUST_PROXY: ${OCS_TRUST_PROXY:-false}
      OCS_LOG_LEVEL: ${OCS_LOG_LEVEL:-INFO}
    volumes:
      # What IT edits lives on the host: opencode.jsonc, users.json, skills/,
      # bootstrap/install.sh. Read-only -- the server never writes here.
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  # TLS termination, if you do not already have an ingress controller.
